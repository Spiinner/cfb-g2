<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CFB G2 — College Football Play-by-Play</title>
    <style>
      /* Browser preview styling — the G2 only sees SDK containers */
      body {
        margin: 0;
        background: #111;
        color: #0f0;
        font-family: monospace;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      #preview {
        width: 576px;
        height: 288px;
        border: 2px solid #0f0;
        position: relative;
        overflow: hidden;
        background: #000;
        image-rendering: pixelated;
      }
      #preview canvas {
        position: absolute;
      }
      #status {
        position: fixed;
        bottom: 10px;
        left: 10px;
        font-size: 12px;
        color: #0a0;
      }
    </style>
  </head>
  <body>
    <div id="preview"></div>
    <div id="status">Initializing...</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
